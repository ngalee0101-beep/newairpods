<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHOPMATE - AirPods Store</title>

<style>

/* GENERAL */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #222;
    background: #f5f5f5;
}

.app {
    max-width: 480px;
    margin: auto;
    background: white;
    min-height: 100vh;
    padding-bottom: 75px;
}

/* HEADER */

header {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
}

.logo {
    font-size: 21px;
    font-weight: 900;
    letter-spacing: -1px;
}

header button {
    border: none;
    background: white;
    font-size: 21px;
    cursor: pointer;
}

/* NAVIGATION */

nav {
    display: flex;
    justify-content: space-around;
    padding: 12px 3px;
    border-bottom: 1px solid #eee;
}

nav a {
    text-decoration: none;
    color: #222;
    font-size: 11px;
    font-weight: bold;
}

/* PROMOTION BANNER */

.banner {
    margin: 13px;
    height: 195px;
    border-radius: 12px;
    padding: 20px;
    position: relative;
    overflow: hidden;

    touch-action: pan-y;
    user-select: none;
    cursor: grab;

    transition: background 0.4s ease;
}

.banner:active {
    cursor: grabbing;
}

/* VERSION A */

.pink {
    background: linear-gradient(
        120deg,
        #ffe5e9,
        #f4aeba
    );
}

.pink h1 {
    color: #df2445;
}

/* VERSION B */

.blue {
    background: linear-gradient(
        120deg,
        #e4f0ff,
        #91baf1
    );
}

.blue h1 {
    color: #1768bd;
}

/* BANNER CONTENT */

.banner small {
    font-size: 10px;
    font-weight: bold;
}

.banner h1 {
    font-size: 38px;
    margin: 12px 0;
    font-weight: 900;
}

.banner p {
    font-size: 11px;
    line-height: 1.5;
}

.banner button {
    border: none;
    border-radius: 20px;
    padding: 9px 16px;
    background: #df2445;
    color: white;
    font-size: 10px;
    cursor: pointer;
}

.blue button {
    background: #1768bd;
}

.art {
    position: absolute;
    right: 15px;
    bottom: 15px;
    font-size: 65px;
    pointer-events: none;
}

/* BANNER DOTS */

.dots {
    text-align: center;
    margin: 15px;
}

.dot {
    width: 8px;
    height: 8px;
    border: none;
    border-radius: 50%;
    background: #ccc;
    cursor: pointer;
    margin: 0 3px;
    padding: 0;
    transition: all 0.3s ease;
}

.dot.active {
    background: #e51b3e;
    width: 18px;
    border-radius: 10px;
}

/* CATEGORY */

section {
    padding: 15px;
}

h2 {
    font-size: 15px;
    margin-bottom: 13px;
}

.categories {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    text-align: center;
}

.category {
    background: #f5f5f5;
    padding: 15px 3px;
    border-radius: 9px;
    font-size: 25px;
}

.category p {
    font-size: 10px;
}

/* SEARCH */

.search {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 20px;
    margin-bottom: 15px;
    outline: none;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 10px;
}

.product img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    background: #f5f5f5;
    border-radius: 8px;
}

.brand {
    font-size: 9px;
    color: #888;
    margin-top: 7px;
}

.product h3 {
    font-size: 11px;
    margin: 6px 0;
}

.price {
    font-size: 12px;
    font-weight: bold;
}

.rating {
    font-size: 9px;
    color: #888;
    margin: 6px 0;
}

.product button {
    width: 100%;
    padding: 9px;
    background: #171717;
    color: white;
    border: none;
    font-size: 10px;
    cursor: pointer;
}

/* BOTTOM MENU */

.bottom {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 480px;
    background: white;
    border-top: 1px solid #eee;

    display: flex;
    justify-content: space-around;
    padding: 10px 0;

    z-index: 10;
}

.bottom a {
    text-decoration: none;
    color: #666;
    font-size: 9px;
    text-align: center;
}

.bottom span {
    display: block;
    font-size: 20px;
    margin-bottom: 4px;
}

/* FOOTER */

footer {
    text-align: center;
    background: #222;
    color: white;
    padding: 25px;
    font-size: 10px;
}

/* DESKTOP */

@media (min-width: 600px) {

    body {
        padding: 20px 0;
    }

    .app {
        border-radius: 12px;
        overflow: hidden;
    }

    .bottom {
        bottom: 20px;
    }

}

</style>

</head>

<body>

<div class="app">

<!-- HEADER -->

<header>

    <button onclick="alert('SHOPMATE MENU')">
        ☰
    </button>

    <div class="logo">
        SHOPMATE
    </div>

    <div>

        <button onclick="document.getElementById('search').focus()">
            ⌕
        </button>

        <button onclick="showCart()">
            🛒
        </button>

    </div>

</header>


<!-- NAVIGATION -->

<nav>

    <a href="#home">홈</a>

    <a href="#products">베스트</a>

    <a href="#products">신상품</a>

    <a href="#products">AirPods</a>

    <a href="#products">케이스</a>

    <a href="#products">라이프</a>

</nav>


<!-- PROMOTION BANNER -->

<div id="home">

    <div class="banner pink" id="banner">

        <div class="banner-content">

            <small>
                SPECIAL PROMOTION
            </small>

            <h1 id="title">
                5% 할인
            </h1>

            <p id="description">
                지금 구매하면<br>
                놓치지 마세요!
            </p>

            <button onclick="event.stopPropagation(); document.getElementById('products').scrollIntoView({behavior:'smooth'});">
                지금 쇼핑하기 →
            </button>

        </div>

        <div class="art" id="art">
            🎧🎁
        </div>

    </div>


    <!-- DOTS -->

    <div class="dots">

        <button
            class="dot active"
            id="d0"
            onclick="changeBanner(0)">
        </button>

        <button
            class="dot"
            id="d1"
            onclick="changeBanner(1)">
        </button>

    </div>

</div>


<!-- CATEGORY -->

<section>

    <h2>
        추천 카테고리
    </h2>

    <div class="categories">

        <div>
            <div class="category">🎧</div>
            <p>AirPods</p>
        </div>

        <div>
            <div class="category">🎵</div>
            <p>AirPods Pro</p>
        </div>

        <div>
            <div class="category">🛡️
